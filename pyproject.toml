[project]
name = "gated-improvement"
version = "0.1.1"
description = "gated-improvement — improve a program-synthesis solver's configuration; rewarded only by a sealed, compute-matched, sign-test-gated holdout (single-turn, reward-hacking resistant)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Intelligence Research Project" }]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.1"]
keywords = ["verifiers", "reinforcement-learning", "environment", "reward-hacking", "self-improvement", "program-synthesis"]

[project.urls]
Repository = "https://github.com/sunghunkwag/gated-improvement"
Hub = "https://app.primeintellect.ai/dashboard/environments/intelligence-research-project/gated-improvement"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gated_improvement"]
